name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build & Type-check (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript type-check & Next lint)
        run: npm run build

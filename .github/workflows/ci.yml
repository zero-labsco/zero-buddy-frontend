name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
              - '**/.gitignore'

  lint-and-build:
    name: Format, Lint & Build (Next.js)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run lint:prettier

      - name: ESLint (Airbnb)
        run: npm run lint:eslint

      - name: Build (TypeScript type-check & Next build)
        run: npm run build

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history for PR)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint PR commits (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # 纯文档改动时跳过重活 job，本 job 提供绿色 check 以满足 PR 要求
  docs-check:
    name: Docs only (skip heavy CI)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - run: echo "Only documentation changed — skipping build/lint/test."

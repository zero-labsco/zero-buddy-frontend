version: 2
updates:
  # npm 依赖
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # 安全优先：安全相关的版本更新优先于“仅仅是最新版”的功能更新
    # （dependabot 会优先处理带安全公告的更新，再处理普通最新版）
    pull-request-branch-name:
      separator: '-'
    # 不允许 Dependabot 自动合并：所有更新必须经 audit / dependency-review 门禁
    # （version-updates 本身不支持 auto-merge 关闭项；安全门禁由 CI 负责拦截）
    # 不越过 Next.js 主版本：Next 16 需要 ESLint 9（flat config 破坏性变更），
    # 保持 15.x 只允许补丁/安全更新，避免“为最新版牺牲稳定性/安全”。
    # 如需升级到 Next 16，请人工评估后再改此规则。
    ignore:
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']

  # GitHub Actions 工作流
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
